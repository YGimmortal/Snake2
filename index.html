<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HORIZON SNAKE — a dusk arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div id="app">
  <div class="panel">
    <div class="brand">
      <div class="horizon-logo" aria-label="Horizon Snake"><span class="logo-mark">HS</span><span class="logo-word">HORIZON</span><span class="logo-subword">SNAKE</span></div>
      <p>chase the last light</p>
      <div class="sig">
        <div class="sig-seg"></div><div class="sig-seg"></div><div class="sig-seg"></div><div class="sig-seg"></div><div class="sig-seg"></div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat high"><div class="label">High Score</div><div class="value" id="menu-highscore">0</div></div>
      <div class="stat coin"><div class="label">Coins</div><div class="value" id="menu-coins">0 ¢</div></div>
    </div>

    <a href="game.html"><button class="btn primary" id="btn-play"><span data-icon="play"></span> PLAY</button></a>
    <div class="row-btns">
      <a href="shop.html" style="flex:1"><button class="btn"><span data-icon="shop"></span> Shop</button></a>
      <a href="settings.html" style="flex:1"><button class="btn"><span data-icon="gear"></span> Settings</button></a>
    </div>
    <div class="row-btns">
      <a href="advancements.html" style="flex:1"><button class="btn"><svg class="hs-icon" width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px"><path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 5H4.5a2 2 0 0 0 0 4H6M17 5h2.5a2 2 0 0 1 0 4H16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 12v3m-3.5 3.5h7M9 19h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> Advancements</button></a>
      <a href="features.html" style="flex:1"><button class="btn"><span data-icon="image"></span> Features</button></a>
    </div>

    <a href="advancements.html">
    <div class="ach-strip">
      <span><svg class="hs-icon" width="14" height="14" viewBox="0 0 24 24" style="vertical-align:-2px"><path d="M7 4h10v3a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M7 5H4.5a2 2 0 0 0 0 4H6M17 5h2.5a2 2 0 0 1 0 4H16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M12 12v3m-3.5 3.5h7M9 19h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg> Advancements</span>
      <span class="ach-count" id="ach-count">0/10</span>
    </div>
    </a>

    <div id="history-list" style="margin-top:14px;"></div>
  </div>
  <div class="site-footer">HORIZON SNAKE · a snake arcade · saved locally in this browser</div>
</div>

<script src="assets/common.js"></script>
<script>
  document.querySelectorAll("[data-icon]").forEach(el => el.innerHTML = icon(el.dataset.icon, 14));
  document.getElementById("menu-highscore").textContent = save.highScore;
  document.getElementById("menu-coins").textContent = fmtCoins(save.coins);
  document.getElementById("ach-count").textContent = save.achievements.length + "/" + ACHIEVEMENTS.length;

  const hist = document.getElementById("history-list");
  if (save.history.length === 0) {
    hist.innerHTML = '<div class="empty-hint">No runs yet — play a round to start your record.</div>';
  } else {
    save.history.slice(0, 5).forEach(h => {
      const row = document.createElement("div");
      row.className = "history-row";
      row.innerHTML = `<span>${h.score} pts</span><span>+${h.coins} ¢</span>`;
      hist.appendChild(row);
    });
  }

  document.getElementById("btn-play").addEventListener("click", () => { ensureAudio(); });
</script>
</body>
</html>
